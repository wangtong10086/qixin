name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Rebuild compile-only Vector API
        run: python3 tools/build_api.py
      - name: Build native service
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" python3 tools/build_native.py
      - name: Test, build and lint
        run: ./gradlew :core:test :app:assembleRelease :app:lintRelease --console=plain
